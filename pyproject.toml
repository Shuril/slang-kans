[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slang-kans"
version = "0.1.0"
description = "slang-KANs: High-Performance Cross-Platform Kolmogorov-Arnold Networks in Slang (CUDA, Metal, Vulkan, CPU)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alex", email = "cara26@bk.ru" }
]
keywords = [
    "slang-kans",
    "slang",
    "slangpy",
    "kan",
    "kolmogorov-arnold-networks",
    "tensor-cores",
    "cross-platform",
    "cuda",
    "metal",
    "vulkan",
    "autodiff"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "slangpy>=0.43.0",
    "numpy>=1.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "sympy>=1.10.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["slang_kans*"]

[tool.setuptools.package-data]
slang_kans = ["kernels/*.slang"]
